apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-gateway-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    # Applied after the monitoring Application (wave 0) so the Grafana
    # sidecar that watches this label already exists -- same reasoning as
    # apps/monitoring/dcgm-dashboard-configmap.yaml.
    argocd.argoproj.io/sync-wave: "1"
data:
  homelab-gateway-dashboard.json: |
    {
      "title": "Homelab Gateway",
      "description": "Request rate/latency and Ollama model usage through homelab-gateway, plus CPU/RAM for whisper, piper, ollama, and the gateway itself.",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "title": "Request rate by backend",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (backend) (rate(gateway_http_requests_total[5m]))",
              "legendFormat": "{{backend}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "p95 latency by backend",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, backend) (rate(gateway_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{backend}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Requests by status code",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (status_code) (rate(gateway_http_requests_total[5m]))",
              "legendFormat": "{{status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Ollama requests by model",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (model) (rate(gateway_ollama_model_requests_total[5m]))",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "CPU usage by service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"whisper|piper|ollama|homelab-gateway\"}[5m]))",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Memory usage by service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"whisper|piper|ollama|homelab-gateway\"})",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "time": { "from": "now-6h", "to": "now" }
    }
