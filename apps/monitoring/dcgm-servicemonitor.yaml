apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-dcgm-exporter
  namespace: monitoring
  annotations:
    # Applied after the monitoring Application (wave 0) so the ServiceMonitor CRD
    # (installed by that chart) already exists in the cluster.
    argocd.argoproj.io/sync-wave: "1"
spec:
  namespaceSelector:
    matchNames:
      - gpu-operator-resources
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  endpoints:
    - port: gpu-metrics
      # Lowered from 30s (2026-07-30): most inference calls on this box finish
      # in under 30s, so the old interval could miss a short call's GPU
      # utilization spike entirely. 10s still won't reliably catch calls
      # under ~10s, but samples ~3x more often for a negligible storage cost
      # at this cluster's scale. See the gpu-metrics-visibility skill.
      interval: 10s
