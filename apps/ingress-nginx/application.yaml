apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      valuesObject:
        controller:
          ingressClassResource:
            default: true
          service:
            type: LoadBalancer
            # Pinned rather than left to autoAssign: this is meant to be the one
            # stable entry point every future host-routed app points its hostname
            # at, so it shouldn't shift if a service is recreated. Next free slot
            # after .240 (argocd), .241 (ollama), .242 (grafana) -- see ADR-0002.
            annotations:
              metallb.io/loadBalancerIPs: "192.168.1.243"
          resources:
            requests:
              cpu: 50m
              memory: 90Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
