apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: whisper
  labels:
    app: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      containers:
        - name: whisper
          # CPU multi-arch tag, deliberately not a -gpu variant — see ADR-0016:
          # the node's single GTX 1060 is already fully claimed by Ollama.
          image: onerahmet/openai-whisper-asr-webservice:v1.9.1
          env:
            - name: ASR_ENGINE
              value: faster_whisper
            - name: ASR_MODEL
              value: small
            - name: ASR_DEVICE
              value: cpu
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
