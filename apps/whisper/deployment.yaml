apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: whisper
  labels:
    app: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      runtimeClassName: nvidia
      containers:
        - name: whisper
          image: onerahmet/openai-whisper-asr-webservice:v1.9.1-gpu
          env:
            - name: ASR_ENGINE
              value: faster_whisper
            - name: ASR_MODEL
              value: small
            - name: ASR_DEVICE
              value: cuda
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: 500m
              # 1.5Gi (was 1Gi): confirmed via Prometheus (container_memory_working_set_bytes)
              # that faster_whisper/small on CUDA sits at 1.59-1.82Gi at peak across dozens of
              # pod incarnations -- the old 1Gi request understated real steady-state usage.
              memory: 1.5Gi
            limits:
              cpu: "2"
              # 3Gi (was 2Gi): the 2Gi limit left ~200-400Mi of headroom above observed peaks,
              # not enough -- confirmed multiple pods with Last State: OOMKilled (kube_pod_container_status_last_terminated_reason)
              # over the 2026-08-20 disk-space incident's 7-day window. Same class of issue as
              # Grafana's OOM fix in ADR-0012 (limit sized off assumption, not measured usage).
              memory: 3Gi
              nvidia.com/gpu: 1
